[package]
name = "haku"
version = "0.1.0"
description = "A lightweight desktop browser"
authors = ["Gustavo Motta"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "haku_lib"
# Desktop-only, so an rlib is all that is needed. The template's staticlib and
# cdylib exist for mobile targets, and building them makes `cargo test` load the
# dynamic library instead of the test binary's own code.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is required for Window::add_child, which backs the webview pool.
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "0.38"

[profile.dev]
strip = "debuginfo"
