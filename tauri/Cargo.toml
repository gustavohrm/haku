[package]
name = "haku"
version = "0.1.0"
description = "A lightweight desktop browser"
authors = ["Gustavo Motta"]
license = "Apache-2.0"
rust-version = "1.95"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "haku_lib"
# Desktop-only, so an rlib is all that is needed. The template's staticlib and
# cdylib exist for mobile targets, and building them makes `cargo test` load the
# dynamic library instead of the test binary's own code.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" is required for Window::add_child, which backs the webview pool.
tauri = { version = "2", features = ["unstable", "devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.41", features = ["bundled"] }
# A second launch hands over to the running Haku instead of sharing its
# profile, session and history files with it.
tauri-plugin-single-instance = "2"
# Inflates the files of an extension archive; reading the archive around them
# is Haku's own (`storage::package`). Already built as part of Tauri.
miniz_oxide = "0.8"
# Chrome derives an extension's id from the SHA-256 of its key. Already built
# as part of Tauri.
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# `windows` and `webview2-com` must match the versions Tauri's runtime (wry) uses:
# the WebView2 interfaces Haku receives from Tauri are their types.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[profile.dev]
# No effect on Windows, where the MSVC linker keeps debug information in a
# `.pdb` beside the binary. See docs/ci.md.
strip = "debuginfo"
