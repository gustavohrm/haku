name: CI

on:
  pull_request:
  # A merge queue's check of the merge result before it lands. It never fires in a repository without a queue.
  merge_group:
  # project:start
  # The full check after a merge. A project that requires a merge queue removes this trigger: the queue lands the
  # exact commit it checked, so a push run would only repeat a passed check.
  push:
    branches: [main]
  # project:end

# A pull request pushed to again abandons the run it superseded; a merge-queue run or a push to `main` keeps every
# run, because each is the authoritative check of a commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# project:start
# project:end

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # project:start
    # The interface and its tooling are platform-independent, so they run on the
    # fastest and cheapest runner; Rust runs in its own job below. `docs/ci.md`
    # explains the split.
    timeout-minutes: 15
    # project:end
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # project:start
        # No later step pushes or calls the API, and the template fetch is public, so the token is not left on disk.
        with:
          persist-credentials: false
        # project:end

      - name: Set up the workspace
        uses: ./.github/actions/setup

      # project:start
      # project:end

      # The same command a contributor runs: format, lint, build, typecheck and test, stopping at the first
      # failure. A step only CI can run is a step nobody can reproduce before pushing.
      - name: Verify
        # project:start
        # The web half of `pnpm verify`; the Rust job runs the other half.
        run: pnpm verify:web
        # project:end

      # The project's files against the template commit it last synced with, as .template/README.md describes.
      # It needs the network to fetch the template, and writes nothing.
      - name: Template conformance
        run: node .template/check.mjs

      # A check that writes a file has changed what it was checking, so the run fails. `--untracked-files=all`
      # lists a new file, not only the directory that holds it.
      - name: Working tree is clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A check left the working tree changed."
            exit 1
          fi
        shell: bash

  # project:start
  # Windows is the one platform with a native layer; the macOS and Linux layers
  # are stubs, and Linux would also need WebKitGTK's system libraries to build at
  # all. Rust is verified where Haku actually runs.
  rust:
    name: Rust
    runs-on: windows-latest
    timeout-minutes: 45
    # Line tables only: backtraces keep their file and line, and the variable and
    # type information only a debugger reads is dropped. Measured on a cold run:
    # 9m00s to 8m34s, and a 6% smaller cache; `docs/ci.md` has the breakdown.
    # Local builds keep Cargo's defaults. A panic always prints its backtrace.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node is needed here too: `bindings:check` is a Node script, and the
      # release check compiles the interface bundle into the binary.
      - name: Set up the workspace
        uses: ./.github/actions/setup

      # Installs the version and components `rust-toolchain.toml` names, rather
      # than relying on rustup to do it on first use.
      - name: Install Rust
        run: rustup toolchain install
        shell: bash

      # Keyed on the toolchain and `Cargo.lock`, so a dependency or toolchain
      # change starts a fresh cache instead of reusing stale artifacts.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tauri

      - name: Verify
        run: pnpm verify:rust

      # A release build compiles code a debug build never sees: `open_devtools`
      # exists in release only through Tauri's `devtools` feature. The release
      # profile embeds the interface, so it is built first.
      - name: Check the release profile
        run: |
          pnpm build
          pnpm check:release
        shell: bash

      # A check that writes a file has changed what it was checking, so the run fails. `--untracked-files=all`
      # lists a new file, not only the directory that holds it.
      - name: Working tree is clean
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A check left the working tree changed."
            exit 1
          fi
        shell: bash
  # project:end
