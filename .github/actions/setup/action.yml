name: Set up the workspace
description: Installs the pinned pnpm and Node.js versions and the workspace dependencies.

runs:
  using: composite
  steps:
    # No version input: the action reads `packageManager` from package.json, as pnpm itself does locally.
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    # pnpm has to exist before this step, because the store cache it keys on is resolved through it.
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # A lockfile that disagrees with the manifests fails here rather than being rewritten in CI.
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
