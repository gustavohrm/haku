# Weekly update pull requests, labelled with the repository's own `type:chore` rather than labels Dependabot
# would create. npm updates arrive as catalog changes in pnpm-workspace.yaml, with the lockfile.
#
# The `npm` and `cargo` groups, and the actions' group, take minor and patch updates only, so a week brings
# at most one pull request per group. Dependabot groups each listed directory on its own, so the actions can
# arrive as two. A major update arrives as a pull request of its own, because it is a decision (it may need
# code changes) rather than upkeep, and a group that mixes one in cannot be merged until the major is dealt
# with. The exception is the Cargo `tauri` group, which takes majors too: the crates `tauri`, `tauri-build`,
# `windows` and `webview2-com`, not the npm `@tauri-apps` packages. It proposes their available updates in
# one pull request but does not keep them in lockstep: a Tauri update can still need the matching `windows`
# and `webview2-com` versions raised by hand. `docs/ci.md` records why, under "Dependency updates" and
# "Cargo updates", and why actions are pinned by SHA, under "Pinning third-party actions".
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the composite actions under .github/actions/, which `directory: /` alone misses.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    labels: ["type:chore"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["type:chore"]
    # Node's types follow the Node release in `engines` and `.nvmrc`, so they move when Node does, not on
    # their own: types for a newer Node accept APIs the pinned runtime does not have. Their major and minor
    # track Node's; none was published between 24.13 and 24.19, so they stay on the release just below.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /tauri
    schedule:
      interval: weekly
    labels: ["type:chore"]
    groups:
      # Haku calls WebView2 through the same `windows` and `webview2-com` versions as Tauri's runtime, so
      # their updates are proposed together, majors included. The first matching group wins.
      tauri:
        patterns: ["tauri", "tauri-build", "windows", "webview2-com"]
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
