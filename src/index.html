<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Haku</title>
    <link rel="stylesheet" href="./ui/styles/index.css" />
    <script type="module" src="./ui/scripts/index.ts" defer></script>
  </head>

  <body>
    <section class="flex items-stretch gap-1 p-2 pb-0 select-none" data-tauri-drag-region aria-label="Tabs">
      <div class="flex gap-1.5" id="tab-strip"></div>
      <button class="btn icon sm mb-1" id="new-tab-button" type="button" aria-label="New tab">
        <i class="ic-plus"></i>
      </button>
      <div class="flex-1" data-tauri-drag-region></div>
      <div class="window-controls">
        <button class="wc-btn" id="minimize-button" type="button" aria-label="Minimize">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
        </button>
        <button class="wc-btn" id="maximize-button" type="button" aria-label="Maximize">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path d="M0 0v10h10V0H0zm1 1h8v8H1V1z" fill="currentColor"/></svg>
        </button>
        <button class="wc-btn wc-close" id="close-button" type="button" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><path d="M1 0L0 1l4 4-4 4 1 1 4-4 4 4 1-1-4-4 4-4-1-1-4 4-4-4z" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <nav class="bg-foreground flex w-full items-center gap-1 p-1.5" aria-label="Browser controls">
      <button class="btn icon" id="back-button" type="button" aria-label="Back">
        <i class="ic-arrow-left"></i>
      </button>
      <button class="btn icon" id="forward-button" type="button" aria-label="Forward">
        <i class="ic-arrow-right"></i>
      </button>
      <button class="btn icon" id="refresh-button" type="button" aria-label="Refresh">
        <i class="ic-reload"></i>
      </button>

      <form class="w-full" id="url-form">
        <input
          id="url-input"
          class="ipt"
          name="url"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search or enter address"
          placeholder="Search Google or type a URL"
        />
      </form>

      <button class="btn icon" id="devtools-button" type="button"><i class="ic-devtools"></i></button>
    </nav>

    <section class="flex size-full flex-1" id="browser-surface" aria-label="Page content">
      <div class="surface-placeholder">Loading webview...</div>
    </section>
  </body>
</html>
